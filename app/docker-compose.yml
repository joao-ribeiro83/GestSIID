# One service, one container per environment (ARCHITECTURE.md §2, D-02).
# No file-storage volume: the app has no DOCS_ROOT (ARCHITECTURE.md §2/§6, D-04/D-29) —
# PDFs come from FileServerSIID over HTTP and images live in Oracle BLOB columns.
services:
  api:
    build: .
    image: gestsiid-api:local
    # Run with `docker compose --env-file ../.env up`: ${PORT} below is read from the --env-file
    # (Compose does not interpolate from env_file). ENV_FILE picks another environment's file.
    env_file: ${ENV_FILE:-../.env}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "20"

