# CI gates, exact order per analysis/TEST_STRATEGY.md §5 / ARCHITECTURE.md §8.
# GitLab equivalent: same 8 stages in a .gitlab-ci.yml, with DB_CONNECT_STRING as a
# CI/CD variable gating the "contract" and "e2e" stages. Here it is a repo *variable*
# (vars.DB_CONNECT_STRING): a job-level `if:` cannot read `secrets`, and the connect
# string is an address, not a credential. DB_USER / DB_PASSWORD stay secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # High/critical only — matches SECURITY_FINDINGS.md's accepted-risk list for lower severities.
      - run: pnpm audit --prod --audit-level=high

  lint-typecheck-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # packages/shared resolves to dist/ outside the `development` condition (app/CLAUDE.md).
      - run: pnpm --filter @gestsiid/shared build
      # vite build writes apps/web/src/routeTree.gen.ts (git-ignored), which typecheck needs.
      - run: pnpm --filter @gestsiid/web build
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test

  contract-tests:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    if: ${{ vars.DB_CONNECT_STRING != '' }}
    defaults:
      run:
        working-directory: app
    env:
      DB_CONNECT_STRING: ${{ vars.DB_CONNECT_STRING }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_SCHEMA: ${{ vars.DB_SCHEMA }}
      AMBIENTE_ID: ${{ vars.AMBIENTE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # packages/shared resolves to dist/ outside the `development` condition (app/CLAUDE.md).
      - run: pnpm --filter @gestsiid/shared build
      # Same `pnpm -r test` command; contract specs self-skip via describe.skipIf unless
      # DB_CONNECT_STRING is set (analysis/TEST_STRATEGY.md §1), so no separate test filter.
      - run: pnpm -r test

  build-image:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: false
          tags: gestsiid-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  playwright-smoke:
    runs-on: ubuntu-latest
    needs: build-image
    defaults:
      run:
        working-directory: app
    env:
      DB_CONNECT_STRING: ${{ vars.DB_CONNECT_STRING }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # packages/shared resolves to dist/ outside the `development` condition (app/CLAUDE.md).
      - run: pnpm --filter @gestsiid/shared build
      - run: pnpm exec playwright install --with-deps chromium
      # Login-page-renders / static-asset specs run unconditionally; any spec needing the
      # TEST schema self-skips without DB_CONNECT_STRING (analysis/TEST_STRATEGY.md §5 gate 8).
      - run: pnpm exec playwright test
